name: Greenplaces
description: >-
  Greenplaces is a sustainability and ESG reporting platform that pairs software
  with expert consulting to help companies — especially suppliers responding to
  enterprise requirements — measure their carbon footprint under the GHG Protocol
  and complete sustainability framework submissions including CDP, EcoVadis, SBTi,
  GRI, SASB/ISSB and GRESB. The managed-service platform also supports B Corp
  certification, CSRD readiness, SOC 2 and AI-governance compliance, and tracking
  of regulations such as California SB 253 and SB 261. Greenplaces is venture-backed
  by Felicis and Redpoint Ventures. Added to the API Evangelist network from VC
  portfolio data; the company publishes a managed product (app.greenplaces.com) but
  no public developer API, SDK, or documentation surface at the time of enrichment.
